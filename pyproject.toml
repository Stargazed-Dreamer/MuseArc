[project]
name = "musearc"
version = "0.2.0"
description = "MuseArc: scalable music library cleaning, import, dedupe and export toolkit."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MuseArc" }]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "requests>=2.32.0",
  "numpy>=1.26.0",
  "av>=12.0.0",
  "pyacoustid>=1.3.0",
  "pychromaprint>=1.2.2",
  "mutagen>=1.47.0",
  "PySide6>=6.7.0",
  "pypinyin>=0.53.0",
]

[project.scripts]
musearc = "musearc.app.cli:app"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musearc"]
