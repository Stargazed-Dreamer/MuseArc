[project]
name = "musearc"
version = "0.2.0"
description = "MuseArc: scalable music library cleaning, import, dedupe and export toolkit."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Stargazed-Dreamer" }]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "requests>=2.32.0",
  "numpy>=1.26.0",
  "av>=12.0.0",
  "pyacoustid>=1.3.0",
  "pychromaprint>=1.2.2",
  "mutagen>=1.47.0",
  "PySide6>=6.7.0",
  "pypinyin>=0.53.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-qt>=4.4.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[project.scripts]
musearc = "musearc.app.cli:app"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musearc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
  "error::DeprecationWarning:musearc.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["realLib", "lyrics_llm_review", "tools/chromaprint"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "E501",  # line too long (由 formatter 处理)
  "B008",  # function call in default argument (typer 常用模式)
  "E402",  # module level import not at top of file (本项目刻意在函数/with 块内延迟导入以避免循环依赖)
  "SIM",   # flake8-simplify 风格建议(可读性优先,不强制合并 if/三元表达式等)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
packages = ["musearc"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false

[tool.coverage.run]
source = ["src/musearc"]
branch = true
omit = ["*/tools/*", "*/ui/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
